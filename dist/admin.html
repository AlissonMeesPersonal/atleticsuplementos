<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#151515">
  <title>Gestão | Atletic Suplementos</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
  <script defer src="store-config.js"></script>
  <script defer src="store-data.js"></script>
  <script defer src="admin-auth.js"></script>
  <script defer src="admin.js"></script>
</head>
<body>
  <div class="admin-shell">
    <aside>
      <a href="/"><img class="logo" src="assets/logo.svg" alt="Atletic Suplementos"></a>
      <p class="eyebrow">CENTRAL DE GESTÃO</p>
      <nav id="adminNav" aria-label="Administração"></nav>
      <a href="/" class="back-store">↗ Abrir loja</a>
    </aside>
    <main class="admin-main">
      <header>
        <div><p class="eyebrow">ATLETIC / ADMINISTRATIVO</p><h1 id="pageTitle">Dashboard</h1></div>
        <button id="adminTheme" aria-label="Alternar tema">◐</button>
      </header>
      <div class="setup-notice" id="setupNotice"></div>
      <div id="adminContent"></div>
    </main>
  </div>

  <dialog id="editor">
    <form id="editForm">
      <div class="drawer-head"><h2 id="editTitle">Cadastro</h2><button type="button" id="closeEditor" aria-label="Fechar">×</button></div>
      <div id="fields"></div>
      <section id="imageSearchBox" class="image-search" hidden>
        <div class="image-search-head"><div><strong>Imagem do produto</strong><small>Pesquise pelo nome e selecione a melhor foto.</small></div><button type="button" id="searchImages" class="button secondary">Buscar imagens</button></div>
        <div id="imageSearchStatus" class="muted"></div>
        <div id="imageResults" class="image-results"></div>
      </section>
      <p id="formError" role="alert"></p>
      <button class="button" type="submit">Salvar</button>
    </form>
  </dialog>
  <p id="adminStatus" role="status"></p>
</body>
</html>
